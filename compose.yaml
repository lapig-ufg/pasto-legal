services:
  streamlit_app:
    build: .
    command: uv run semente streamlit
    volumes:
      - .:/app
      - /app/.venv
      - ./data:/app/data:ro
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env