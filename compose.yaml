services:
  # ── Valkey/Redis — debouncing + session state ─────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 900 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./docker-vols/valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pasto-legal

  # ── FastAPI — WhatsApp webhook + OpenClaw Gateway subprocess ───────────
  fastapi_app:
    build: .
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 3000 --reload --reload-dir api --reload-dir agent --reload-exclude "agent/openclaw-workspace/*"
    ports:
      - "3000:3000"
      - "18789:18789"  # OpenClaw Gateway (debug access to /v1/responses)
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_DB=0
      - TOOL_BACKEND_URL=http://localhost:3000
      - CHAT_URL=http://localhost:3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEE_PROJECT=${GEE_PROJECT}
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT}
      - GEE_KEY_FILE=${GEE_KEY_FILE}
      - OPENCLAW_MODEL=google/gemini-3.5-flash-lite
      - OPENCLAW_PROFILE=pasto-legal
      - OPENCLAW_GATEWAY_PORT=18789
    volumes:
      - .:/app
      - /app/.venv
      # Anonymous volume: use the image's copy (chmod go-w in Dockerfile) instead
      # of the Windows host folder, which Docker exposes as mode 777 and OpenClaw
      # blocks as world-writable. Same pattern as /app/.venv above.
      - /app/agent/openclaw-plugin
      - ./docker-vols/tmp:/app/tmp
      - ./docker-vols/logs:/app/logs
      - ./docker-vols/openclaw-profile:/root/.openclaw-pasto-legal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - pasto-legal

  # ── Streamlit — debug interface ───────────────────────────────────────
  streamlit_app:
    build: .
    command: uv run streamlit run ./api/interfaces/streamlit/streamlit_webapp.py --server.port 8080
    volumes:
      - .:/app
      - /app/.venv
      - ./docker-vols/tmp:/app/tmp
      - ./docker-vols/logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - FASTAPI_URL=http://fastapi_app:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      fastapi_app:
        condition: service_started
    networks:
      - pasto-legal

networks:
  pasto-legal:
    driver: bridge

volumes:
  openclaw-profile:
  valkey-data:
