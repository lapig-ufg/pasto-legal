name: pasto-legal
language: pt-BR
domain_module: domain
engine: agno
prompts_dir: domain/prompts
channels: [whatsapp, streamlit]
features:
  tts: true
  interaction-assessment: true
  summarization: true
  guardrails: true
  terms-acceptance:
    enable: true
    file: docs/knowledge/termos_de_uso.md
    url: https://pasto.legal/termos-de-uso
  welcome-media:
    videos:
      - assets/videos/pasto_legal_propaganda.mp4
      - assets/videos/pasto_legal_primeiras_interacoes.mp4
      - assets/videos/pasto_legal_cadastro.mp4
models:
  primary: { provider: google, id: gemini-3.5-flash-lite }
  fallback: { provider: ollama, id: gemma4:31b-cloud }
