# =============================================================================
# Hook texts — ENGLISH DEFAULT (reference/localization base).
#
# User-facing/system messages returned or injected by the validation hooks in
# app/hooks/.
#
# This file is the fallback used whenever the localized hooks.yml is missing
# or has missing/blank keys; each missing part is filled from here and logged
# as a warning.
#
# Translate/adjust these texts to localize the product to another language:
# provide a hooks.yml next to this defaults/ folder with the same structure.
# =============================================================================

pre_hooks:
  # validate_phone_authorization: production message (replaces the user input).
  unauthorized_production: "The user is not authorized to use the system. Do not answer anything they asked before. Your ONLY task now is to inform the user that:- This is an Alpha version with restricted access. - To request access you must fill out the form at: forms.gle/sKqngW7UvjmSJFKk8."
  # validate_phone_authorization: staging message (replaces the user input).
  unauthorized_stagging: "IMPERATIVE SYSTEM INSTRUCTION: The user is not authorized to test this system. Do not answer anything they asked before. Your ONLY task now is to inform the user that:- This is a development version with restricted access. - Only authorized project members have access."
  # validate_phone_authorization: development message (replaces the user input).
  unauthorized_development: "IMPERATIVE SYSTEM INSTRUCTION: The user is a developer testing the authorization pre-hook. Do not answer anything they asked before. Your ONLY task now is to inform the user that:- The pre-hook is working."
  # validate_terms_acceptance: first-contact instruction (replaces the user input).
  terms_first_contact: "IMPERATIVE SYSTEM INSTRUCTION: The NEW user has just arrived. Do not answer anything they asked before. Your ONLY task now is to introduce yourself briefly and ask: 'Do you agree with our terms and conditions?'"
  # validate_terms_acceptance: instruction for the terms validator agent.
  terms_validator_instructions: |
    Analyze whether the user agreed with the terms. Answer only with the JSON.
  # validate_terms_acceptance: message when the user accepts the terms.
  terms_accepted: |
    Hi! I accepted the terms. Introduce yourself, please.
  # validate_terms_acceptance: message when the user does NOT clearly accept.
  terms_not_accepted: "IMPERATIVE SYSTEM INSTRUCTION: The user replied something, but did NOT clearly accept the terms.Explain politely that to continue the analysis it is MANDATORY to agree with the terms. Ask again."

tool_hooks:
  # validate_selected_property_hook: blocking message when no property exists.
  no_property_selected: |
    It was not possible to complete the analysis because there is no selected property.
    Apologize to the user. Ask the user to provide a property.
  # validate_selected_property_hook (pre_hooks.py variant): blocking message
  # when no CAR is registered, with mandatory agent instructions.
  no_car_registered: |
    [SYSTEM] Execution Block: No CAR registered in the system.

    Mandatory action for the Agent:
    1. Inform that the system does not have a selected property yet.
    2. Ask the user to send the **location** using the WhatsApp location pin so the system can identify the CAR automatically.
  # validate_rate_limit_hook: media already delivered in this session.
  media_already_delivered: |
    The requested media has already been generated with these exact parameters and delivered in this session.
  # validate_rate_limit_hook: empty media returned by the satellite.
  media_empty: |
    Error: The satellite integration returned empty media. Try again.
  # validate_rate_limit_hook: external integration failure prefix.
  media_integration_error: |
    External integration error: Failed to run {function_name}. Detail: {error}