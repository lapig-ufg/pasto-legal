services:
  streamlit_app:
    # Development runs the base image directly: the source is bind-mounted over
    # /app, so no app image build is needed. `uv run` syncs the venv on start if
    # the lock changed since the base image was published.
    image: ${BASE_IMAGE:-lapig/pasto-legal:base}
    command: uv run semente launch streamlit
    volumes:
      - .:/app
      - /app/.venv
      - ./data:/app/data:ro
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env