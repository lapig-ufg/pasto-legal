services:
  # ── Valkey/Redis — debouncing + session state ─────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 900 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./docker-vols/valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pasto-legal

  # ── FastAPI — WhatsApp webhook + pi RPC subprocess ────────────────────
  fastapi_app:
    build: .
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 3000 --reload
    ports:
      - "3000:3000"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_DB=0
      - TOOL_BACKEND_URL=http://localhost:3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEE_PROJECT=${GEE_PROJECT}
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT}
      - GEE_KEY_FILE=${GEE_KEY_FILE}
      - PI_PROVIDER=google
      - PI_MODEL=gemini-3.5-flash-lite
    volumes:
      - .:/app
      - /app/.venv
      - ./docker-vols/tmp:/app/tmp
      - ./docker-vols/logs:/app/logs
      - ./docker-vols/pi-sessions:/tmp/pi-sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - pasto-legal

  # ── Streamlit — debug interface ───────────────────────────────────────
  streamlit_app:
    build: .
    command: uv run streamlit run ./api/interfaces/streamlit/streamlit_webapp.py --server.port 8080
    volumes:
      - .:/app
      - /app/.venv
      - ./docker-vols/tmp:/app/tmp
      - ./docker-vols/logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - FASTAPI_URL=http://fastapi_app:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      fastapi_app:
        condition: service_started
    networks:
      - pasto-legal

networks:
  pasto-legal:
    driver: bridge

volumes:
  pi-sessions:
  valkey-data:
