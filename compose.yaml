services:
  streamlit_app:
    build: .
    command: uv run streamlit run ./app/interfaces/streamlit/streamlit_webapp.py --server.port 8080
    volumes:
      - .:/app
      - /app/.venv
      - ./tmp:/app/tmp
    ports:
      - "8081:8080"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env